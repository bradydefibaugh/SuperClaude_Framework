<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff3b0"/>
      <stop offset="35%" stop-color="#ffb000"/>
      <stop offset="70%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#d61f1f"/>
    </linearGradient>
    <radialGradient id="bgglow" cx="50%" cy="46%" r="55%">
      <stop offset="0%"  stop-color="#3a1d05"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="580" rx="26" fill="#0d0f14"/>
  <rect x="0" y="0" width="760" height="580" rx="26" fill="url(#bgglow)"/>
  <rect x="6" y="6" width="748" height="568" rx="22" fill="none" stroke="#ff6a00" stroke-opacity="0.35" stroke-width="2"/>

  <text x="380" y="84" text-anchor="middle" font-size="58" font-weight="bold"
