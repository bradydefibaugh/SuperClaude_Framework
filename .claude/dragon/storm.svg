    <tspan x="205" dy="27">   )   /^\/   _)</tspan>
    <tspan x="205" dy="27">   )   _ /  / _)</tspan>
    <tspan x="205" dy="27">   /\  )/\/ ||  | )_)</tspan>
    <tspan x="205" dy="27">  &lt;  &gt;      |(,,) )__)</tspan>
